<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A través de los ojos de Mario</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #050507;
            color: #f4f3ef;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Pantalla de inicio */
        #landing {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at 50% 45%, #14151c 0%, #050507 80%);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #landing.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.5rem, 6vw, 4.6rem);
            font-weight: 400;
            line-height: 1.1;
            color: #f7f6f2;
            margin-bottom: 2.8rem;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .title em {
            font-style: italic;
            color: #d6c5a3;
        }

        .btn-vr {
            appearance: none;
            border: 1px solid rgba(214, 197, 163, 0.45);
            background: rgba(214, 197, 163, 0.08);
            color: #f7f6f2;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 1.15rem 2.8rem;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.35s ease;
        }

        .btn-vr:hover {
            background: #d6c5a3;
            color: #08080a;
            border-color: #d6c5a3;
            transform: translateY(-2px);
        }

        /* Canvas WebGL */
        #vr-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* HUD y controles */
        #hud-overlay {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #hud-overlay.visible {
            opacity: 1;
        }

        .hud-pill {
            pointer-events: auto;
            background: rgba(10, 10, 14, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(244, 243, 239, 0.85);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .hud-pill:hover {
            color: #fff;
            border-color: rgba(214, 197, 163, 0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <main id="landing">
        <h1 class="title">A través de los ojos de <em>Mario</em></h1>
        <button id="start-btn" class="btn-vr">Experiencia VR</button>
    </main>

    <div id="hud-overlay">
        <button id="exit-btn" class="hud-pill">✕ Salir</button>
        <span id="counter-pill" class="hud-pill" style="cursor: default;">1 / 16</span>
    </div>

    <canvas id="vr-canvas"></canvas>

    <script>
        const PHOTOS = [
            'foto (1).jpg', 'foto (2).jpg', 'foto (3).jpg', 'foto (4).jpg',
            'foto (5).jpg', 'foto (6).jpg', 'foto (7).jpg', 'foto (8).jpg',
            'foto (9).jpg', 'foto (10).jpg', 'foto (11).jpg', 'foto (12).jpg',
            'foto (13).jpg', 'foto (14).jpg', 'foto (15).jpg', 'foto (16).jpg'
        ];

        const landing = document.getElementById('landing');
        const startBtn = document.getElementById('start-btn');
        const exitBtn = document.getElementById('exit-btn');
        const hudOverlay = document.getElementById('hud-overlay');
        const counterPill = document.getElementById('counter-pill');
        const canvas = document.getElementById('vr-canvas');

        let appInitialized = false;
        let isVRActive = false;
        let currentIndex = 0;
        let renderer, scene, leftCamera, rightCamera, headRig, screenAnchor;
        let leftRT, rightRT, vrPostMaterial, postScene, postCamera;
        let activeTexture, currentScreenMesh;
        
        let targetQuaternion = new THREE.Quaternion();
        let baseQuaternion = new THREE.Quaternion();
        let hasGyro = false;
        let clock = new THREE.Clock();
        let photoInterval = null;
        let textureLoader = null;

        const IPD = 0.064;
        const SCREEN_DISTANCE = 2.6;
        const FOV_DEG = 82;

        function initApp() {
            if (appInitialized) return;
            appInitialized = true;

            try {
                renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.autoClear = false;

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x040406);

                headRig = new THREE.Group();
                scene.add(headRig);

                leftCamera = new THREE.PerspectiveCamera(FOV_DEG, 1, 0.1, 30);
                rightCamera = new THREE.PerspectiveCamera(FOV_DEG, 1, 0.1, 30);
                leftCamera.position.set(-IPD * 0.5, 0, 0);
                rightCamera.position.set(IPD * 0.5, 0, 0);
                headRig.add(leftCamera);
                headRig.add(rightCamera);

                screenAnchor = new THREE.Group();
                scene.add(screenAnchor);

                const c = document.createElement('canvas');
                c.width = 1024; c.height = 680;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#111217'; ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = '#d6c5a3'; ctx.font = '300 26px Inter, sans-serif';
                ctx.textAlign = 'center'; ctx.fillText('Cargando fotografías...', c.width/2, c.height/2);
                activeTexture = new THREE.CanvasTexture(c);

                buildScreenForAspect(1.5);

                const rtParams = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
                leftRT = new THREE.WebGLRenderTarget(512, 512, rtParams);
                rightRT = new THREE.WebGLRenderTarget(512, 512, rtParams);

                postScene = new THREE.Scene();
                postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

                vrPostMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        tLeft: { value: leftRT.texture },
                        tRight: { value: rightRT.texture },
                        uTime: { value: 0 }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
                    `,
                    fragmentShader: `
                        precision mediump float;
                        uniform sampler2D tLeft;
                        uniform sampler2D tRight;
                        uniform float uTime;
                        varying vec2 vUv;

                        void main() {
                            bool isRight = vUv.x >= 0.5;
                            vec2 uv = isRight ? vec2((vUv.x - 0.5) * 2.0, vUv.y) : vec2(vUv.x * 2.0, vUv.y);
                            
                            float divider = smoothstep(0.002, 0.006, abs(vUv.x - 0.5));

                            vec3 col;
                            if (!isRight) {
                                col = texture2D(tLeft, uv).rgb;
                            } else {
                                vec2 skewedUv = uv + vec2((uv.y - 0.5) * 0.10 + 0.002 * sin(uTime + uv.y * 12.0), (uv.x - 0.5) * 0.06);
                                
                                vec3 sum = vec3(0.0);
                                float blurRadius = 0.006;
                                
                                sum += texture2D(tRight, clamp(skewedUv + vec2(blurRadius, 0.0), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(-blurRadius, 0.0), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(0.0, blurRadius), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(0.0, -blurRadius), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(blurRadius * 0.7, blurRadius * 0.7), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(-blurRadius * 0.7, blurRadius * 0.7), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(blurRadius * 0.7, -blurRadius * 0.7), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv + vec2(-blurRadius * 0.7, -blurRadius * 0.7), 0.01, 0.99)).rgb;
                                sum += texture2D(tRight, clamp(skewedUv, 0.01, 0.99)).rgb * 2.0;
                                
                                col = sum / 10.0;
                                
                                float vignette = length(uv - 0.5);
                                col *= (0.8 + 0.2 * (1.0 - vignette * 0.4));
                            }
                            gl_FragColor = vec4(col * divider, 1.0);
                        }
                    `
                });

                const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vrPostMaterial);
                postScene.add(postQuad);

                updateStereoProjection();
                window.addEventListener('resize', updateStereoProjection);

                textureLoader = new THREE.TextureLoader();
                loadPhoto(0);
                animate();

                photoInterval = setInterval(() => {
                    loadPhoto(currentIndex + 1);
                }, 30000);

            } catch (err) {
                console.error("Error inicializando WebGL:", err);
            }
        }

        function createCurvedGeometry(width, height, radius) {
            const geo = new THREE.PlaneGeometry(width, height, 32, 16);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let angle = x / radius;
                pos.setX(i, Math.sin(angle) * radius);
                pos.setZ(i, (Math.cos(angle) - 1.0) * radius);
            }
            geo.computeVertexNormals();
            return geo;
        }

        function buildScreenForAspect(aspect) {
            if (currentScreenMesh) {
                screenAnchor.remove(currentScreenMesh);
                currentScreenMesh.geometry.dispose();
                if (currentScreenMesh.material.map && currentScreenMesh.material.map !== activeTexture) {
                    currentScreenMesh.material.map.dispose();
                }
                currentScreenMesh.material.dispose();
            }
            const w = 1.95 * Math.max(0.65, Math.min(2.1, aspect));
            const geo = createCurvedGeometry(w, 1.95, 3.2);
            const mat = new THREE.MeshBasicMaterial({ map: activeTexture });
            currentScreenMesh = new THREE.Mesh(geo, mat);
            currentScreenMesh.position.set(0, 0, -SCREEN_DISTANCE);
            screenAnchor.add(currentScreenMesh);
        }

        function updateStereoProjection() {
            if (!renderer) return;
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            leftRT.setSize(w/2, h);
            rightRT.setSize(w/2, h);

            const aspect = (w/2) / h;
            const top = 0.1 * Math.tan(THREE.MathUtils.degToRad(FOV_DEG * 0.5));
            const shift = (IPD * 0.1 * 0.5) / SCREEN_DISTANCE;

            leftCamera.projectionMatrix.makePerspective(-aspect*top + shift, aspect*top + shift, top, -top, 0.1, 30);
            rightCamera.projectionMatrix.makePerspective(-aspect*top - shift, aspect*top - shift, top, -top, 0.1, 30);
        }

        function loadPhoto(index) {
            if (!PHOTOS.length || !textureLoader) return;
            currentIndex = ((index % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
            counterPill.textContent = `${currentIndex + 1} / ${PHOTOS.length}`;

            textureLoader.load(PHOTOS[currentIndex], (tex) => {
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                if (activeTexture && activeTexture.dispose) activeTexture.dispose();
                activeTexture = tex;
                const aspect = tex.image ? tex.image.width / tex.image.height : 1.5;
                buildScreenForAspect(aspect);
            }, undefined, (err) => {
                console.warn(`No se pudo cargar la imagen: ${PHOTOS[currentIndex]}`, err);
            });
        }

        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(() => {});
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        const kamerTarget = new THREE.Euler();
        const q0 = new THREE.Quaternion();
        const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
        const landscapeCorrection = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);

        function handleOrientation(e) {
            if (e.alpha === null) return;

            const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
            const beta = THREE.MathUtils.degToRad(e.beta || 0);
            const gamma = THREE.MathUtils.degToRad(e.gamma || 0);

            kamerTarget.set(beta, alpha, -gamma, 'YXZ');
            targetQuaternion.setFromEuler(kamerTarget);
            targetQuaternion.multiply(q1);
            targetQuaternion.premultiply(q0);

            // Corrección segura y rápida basada en el ancho y alto de la ventana (horizontal vs vertical)
            if (window.innerWidth > window.innerHeight) {
                targetQuaternion.multiply(landscapeCorrection);
            }

            hasGyro = true;
        }

        function recenterGyro() {
            if (hasGyro) {
                baseQuaternion.copy(targetQuaternion).invert();
            }
        }

        startBtn.addEventListener('click', () => {
            landing.classList.add('hidden');
            hudOverlay.classList.add('visible');
            isVRActive = true;

            initApp();
            requestOrientationPermission();

            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }
        });

        exitBtn.addEventListener('click', () => {
            isVRActive = false;
            landing.classList.remove('hidden');
            hudOverlay.classList.remove('visible');
            if (photoInterval) clearInterval(photoInterval);

            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        });

        canvas.addEventListener('pointerdown', () => {
            if (isVRActive) recenterGyro();
        });

        window.addEventListener('keydown', (e) => {
            if (!isVRActive) return;
            if (e.key === ' ' || e.key === 'Enter') recenterGyro();
            if (e.key === 'ArrowRight') loadPhoto(currentIndex + 1);
            if (e.key === 'ArrowLeft') loadPhoto(currentIndex - 1);
            if (e.key === 'Escape') exitBtn.click();
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isVRActive || !renderer) return;

            const elapsed = clock.getElapsedTime();
            if (vrPostMaterial && vrPostMaterial.uniforms) {
                vrPostMaterial.uniforms.uTime.value = elapsed;
            }

            if (hasGyro) {
                let finalQuaternion = new THREE.Quaternion();
                finalQuaternion.multiplyQuaternions(baseQuaternion, targetQuaternion);
                headRig.quaternion.slerp(finalQuaternion, 0.2);
            }

            renderer.setRenderTarget(leftRT); renderer.clear(); renderer.render(scene, leftCamera);
            renderer.setRenderTarget(rightRT); renderer.clear(); renderer.render(scene, rightCamera);
            renderer.setRenderTarget(null); renderer.clear(); renderer.render(postScene, postCamera);
        }
    </script>
</body>
</html>
